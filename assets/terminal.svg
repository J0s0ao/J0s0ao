<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 2; }
    .bar { fill: #161b22; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 15px; }
    .p { fill: #7ee787; }
    .c { fill: #e6edf3; }
    .k { fill: #79c0ff; }
    .v { fill: #ffa657; }
    .d { fill: #8b949e; }
    .l { opacity: 0; animation: show 0.01s forwards; }
    .l1 { animation-delay: 0.4s; }
    .l2 { animation-delay: 1.2s; }
    .l3 { animation-delay: 2.0s; }
    .l4 { animation-delay: 2.8s; }
    .l5 { animation-delay: 3.6s; }
    .l6 { animation-delay: 4.4s; }
    .l7 { animation-delay: 5.2s; }
    .l8 { animation-delay: 6.0s; }
    .l9 { animation-delay: 6.8s; }
    .cursor { fill: #7ee787; animation: blink 1s steps(1) infinite; animation-delay: 7s; opacity: 0; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
